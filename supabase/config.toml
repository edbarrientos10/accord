project_id = "accord"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 54322
major_version = 17
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/reset-password"]
enable_signup = false
minimum_password_length = 12
[auth.email]
# Keep the email provider enabled for bootstrapped owners.
# The global auth.enable_signup=false above denies new public accounts.
enable_signup = true
enable_confirmations = true
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[storage]
enabled = true
file_size_limit = "3MiB"
